; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = c3_mini

[env:c3_mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
#build_flags =  -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    ; enable USB serial
                -DARDUINO_USB_CDC_ON_BOOT=1
                -DARDUINO_USB_MODE=1
monitor_speed = 115200
#monitor_port = /dev/cu.usbmodem01
upload_speed = 115200
upload_protocol = esptool
#upload_port = /dev/cu.usbmodem01
lib_deps = 
        https://github.com/adafruit/Adafruit_IO_Arduino.git
        https://github.com/adafruit/Adafruit_ADXL345.git
; Adafruit IO Arduino's dependency list pulls in WiFi101/WiFiNINA, whose WiFi.h
; shadows the ESP32 core's WiFi library and makes WiFi.status() hang.
lib_ignore =
    WiFi101
    WiFiNINA_-_Adafruit_Fork
