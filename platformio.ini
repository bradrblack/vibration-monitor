; PlatformIO Project Configuration File
;
; One firmware, many monitored devices. Each [env:<device>] below sets DEVICE_NAME
; (which appears in every Adafruit IO event and ntfy message) plus that machine's
; tuning as build flags. Build one device with `pio run -e <device>`.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pump

; Settings shared by every device environment.
[env]
#platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    ; enable USB serial
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_speed = 115200
upload_speed = 115200
upload_protocol = esptool
lib_deps =
    https://github.com/adafruit/Adafruit_IO_Arduino.git
    https://github.com/adafruit/Adafruit_ADXL345.git
; Adafruit IO Arduino's dependency list pulls in WiFi101/WiFiNINA, whose WiFi.h
; shadows the ESP32 core's WiFi library and makes WiFi.status() hang.
lib_ignore =
    WiFi101
    WiFiNINA_-_Adafruit_Fork

; ---- Devices ----------------------------------------------------------------
; Tunables (all optional, defaults live in the sketch):
;   ON_RMS_THRESHOLD / OFF_RMS_THRESHOLD  vibration thresholds, m/s^2 RMS
;   RUN_CONFIRM_MS / STOP_CONFIRM_MS      continuous vibration/quiet needed to
;                                         start/stop a run
; Calibrate each machine from the rms= values printed over serial while it is
; idle and running.

[env:pump]
build_flags =
    ${env.build_flags}
    -DDEVICE_NAME=\"pump\"
    -DON_RMS_THRESHOLD=0.40f
    -DOFF_RMS_THRESHOLD=0.20f
    -DRUN_CONFIRM_MS=3000UL
    -DSTOP_CONFIRM_MS=3000UL

; Template for another device -- uncomment, rename, and calibrate. A washer
; pauses inside a cycle (fill, soak, drain), so give it a long STOP_CONFIRM_MS
; or one cycle will be reported as several. The numbers below are placeholders,
; not calibrated values.
;
; [env:washer]
; build_flags =
;     ${env.build_flags}
;     -DDEVICE_NAME=\"washer\"
;     -DON_RMS_THRESHOLD=0.40f
;     -DOFF_RMS_THRESHOLD=0.20f
