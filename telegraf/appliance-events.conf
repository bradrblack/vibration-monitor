# Drop-in Telegraf config: Adafruit IO appliance-events feed -> InfluxDB 2.x.
#
# Install on the InfluxDB host as /etc/telegraf/telegraf.d/appliance-events.conf
# (adjust for your OS), put the variables from appliance-events.env.example in
# Telegraf's environment file, then restart Telegraf.
#
# Each start/stop event becomes one point:
#   appliance_state,device=<name> event="start"|"stop", running=1|0, seconds=<run length, stop only>
# timestamped with the event's own "at" time (events can be delivered up to a
# minute late, or in a burst after an outage, so arrival time would be wrong).

[[inputs.mqtt_consumer]]
  servers = ["ssl://io.adafruit.com:8883"]
  # /f/ topics deliver the stored value itself, i.e. the event JSON from the firmware.
  topics = ["${IO_USERNAME}/f/${IO_EVENT_FEED}"]
  username = "${IO_USERNAME}"
  password = "${IO_KEY}"
  # No fixed client_id: the broker drops an existing client when a second one connects
  # with the same ID, so a test run would kick the service off (and vice versa).
  qos = 0
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "appliance_state"
    # Firmware format: %Y-%m-%dT%H:%M:%S%z, e.g. 2026-09-20T11:16:50-0400
    timestamp_path = "at"
    timestamp_format = "2006-01-02T15:04:05-0700"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "event"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "seconds"
      type = "float"
      optional = true

# Numeric state for graphing: start -> 1, stop -> 0 (the "event" string is kept).
[[processors.enum]]
  namepass = ["appliance_state"]
  [[processors.enum.mapping]]
    fields = ["event"]
    dest = "running"
    [processors.enum.mapping.value_mappings]
      start = 1
      stop = 0

# namepass keeps this from also receiving (or duplicating) metrics from other
# inputs in your main telegraf.conf.
[[outputs.influxdb_v2]]
  namepass = ["appliance_state"]
  urls = ["http://192.168.3.252:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
